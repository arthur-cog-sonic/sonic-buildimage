- stage: Test
  dependsOn: BuildVS
  condition: succeeded()
  variables:
  - name: inventory
    value: veos_vtb
  - name: testbed_file
    value: vtestbed.yaml

  jobs:
  - job: kvmtest_klish_aaa
    pool: sonic-build
    displayName: "kvmtest-t0 klish_aaa"
    timeoutInMinutes: 240
    steps:
    - template: .azure-pipelines/cleanup.yml
    - checkout: self
      clean: true
      submodules: recursive
      displayName: 'Checkout code'

    - checkout: sonic-mgmt
      clean: true
      displayName: 'Checkout sonic-mgmt'

    - script: |
        sudo rm -rf ../target
        sudo rm -rf ../*.deb
      displayName: "Cleanup artifacts"

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: sonic-buildimage.vs
      displayName: "Download sonic-buildimage.vs artifact"

    - script: |
        set -ex
        sudo mkdir -p /data/sonic-vm/images
        sudo cp -v ../target/sonic-vs.img.gz /data/sonic-vm/images/sonic-vs.img.gz
        sudo gzip -fd /data/sonic-vm/images/sonic-vs.img.gz
        username=$(id -un)
        sudo chown -R $username.$username /data/sonic-vm
      displayName: "Prepare VS image"

    - script: |
        set -ex
        sudo mkdir -p /data/sonic-mgmt
        sudo cp -rf sonic-mgmt/* /data/sonic-mgmt/
        sudo cp -rf sonic-mgmt/.* /data/sonic-mgmt/ 2>/dev/null || true
        username=$(id -un)
        sudo chown -R $username.$username /data/sonic-mgmt
        sed -i s/use_own_value/${username}/ /data/sonic-mgmt/ansible/veos_vtb
        echo aaa > /data/sonic-mgmt/ansible/password.txt
      displayName: "Setup sonic-mgmt"

    - script: |
        set -ex
        if ! docker ps --filter name=sonic-mgmt --format '{{.Names}}' | grep -q sonic-mgmt; then
          echo "sonic-mgmt container not running, starting it..."
          docker run -d --name sonic-mgmt \
            -v /data/sonic-mgmt:/data/sonic-mgmt \
            -v /data/sonic-vm:/data/sonic-vm \
            --privileged \
            docker-sonic-mgmt:latest \
            sleep infinity || echo "Warning: could not start sonic-mgmt container, will try running tests directly"
        fi
      displayName: "Ensure sonic-mgmt container"

    - script: |
        set -ex
        if docker ps --filter name=sonic-mgmt --format '{{.Names}}' | grep -q sonic-mgmt; then
          docker exec sonic-mgmt bash -c "pushd /data/sonic-mgmt/ansible && ./testbed-cli.sh -m $(inventory) -t $(testbed_file) -k ceos refresh-dut vms-kvm-t0 password.txt"
          sleep 120
          docker exec sonic-mgmt bash -c "pushd /data/sonic-mgmt/ansible && ./testbed-cli.sh -m $(inventory) -t $(testbed_file) deploy-mg vms-kvm-t0 lab password.txt"
          sleep 180
        else
          pushd /data/sonic-mgmt/ansible
          ./testbed-cli.sh -m $(inventory) -t $(testbed_file) -k ceos refresh-dut vms-kvm-t0 password.txt
          sleep 120
          ./testbed-cli.sh -m $(inventory) -t $(testbed_file) deploy-mg vms-kvm-t0 lab password.txt
          sleep 180
          popd
        fi
      displayName: "Setup testbed"

    - script: |
        set -ex
        rm -rf /data/sonic-mgmt/tests/logs
        mkdir -p /data/sonic-mgmt/tests/logs

        if docker ps --filter name=sonic-mgmt --format '{{.Names}}' | grep -q sonic-mgmt; then
          docker exec sonic-mgmt bash -c "cd /data/sonic-mgmt/tests && python -m pytest klish_aaa/test_klish_aaa.py \
            -v \
            --inventory ../ansible/veos_vtb \
            --host-pattern vlab-01 \
            --testbed vms-kvm-t0 \
            --testbed_file ../ansible/vtestbed.yaml \
            --log-cli-level info \
            --junitxml logs/klish_aaa/tr.xml \
            --allow_recover \
            --completeness_level=confident \
            2>&1 | tee logs/klish_aaa/test_output.log"
        else
          cd /data/sonic-mgmt/tests
          python -m pytest klish_aaa/test_klish_aaa.py \
            -v \
            --inventory ../ansible/veos_vtb \
            --host-pattern vlab-01 \
            --testbed vms-kvm-t0 \
            --testbed_file ../ansible/vtestbed.yaml \
            --log-cli-level info \
            --junitxml logs/klish_aaa/tr.xml \
            --allow_recover \
            --completeness_level=confident \
            2>&1 | tee logs/klish_aaa/test_output.log
        fi
      displayName: "Run Klish AAA tests"

    - script: |
        cp -r /data/sonic-mgmt/tests/logs $(Build.ArtifactStagingDirectory)/ || true
        username=$(id -un)
        sudo chown -R $username.$username $(Build.ArtifactStagingDirectory)
      displayName: "Collect test logs"
      condition: succeededOrFailed()

    - publish: $(Build.ArtifactStagingDirectory)/logs
      artifact: sonic-buildimage.kvmtest.klish_aaa.log@$(System.JobAttempt)
      displayName: "Archive klish_aaa test logs"
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      inputs:
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/logs/**/*.xml'
        testRunTitle: kvmtest.klish_aaa
      condition: succeededOrFailed()
