# Test stage - uses local KVM execution via pr_test_local.yml from sonic-mgmt
# instead of Microsoft's Elastictest service (not available in Cisco-SONiC-PoC)
- stage: Test
  pool: sonic-build
  dependsOn: BuildVS
  condition: and(succeeded(), and(ne(stageDependencies.BuildVS.outputs['vs.SetVar.SKIP_VSTEST'], 'YES'), in(dependencies.BuildVS.result, 'Succeeded', 'SucceededWithIssues')))
  variables:
  - name: inventory
    value: veos_vtb
  - name: testbed_file
    value: vtestbed.csv
  jobs:
  - template: .azure-pipelines/pr_test_local.yml@sonic-mgmt
    parameters:
      MAX_RUN_TEST_MINUTES: ${{ parameters.TIMEOUT_IN_MINUTES_PR_TEST }}
