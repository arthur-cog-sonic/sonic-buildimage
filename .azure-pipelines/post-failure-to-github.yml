# Template to post build failure logs to GitHub PR comments
# Posts error summaries and log tails so Devin and reviewers can see failures.
# Handles large logs by limiting per-file output and rebuilding if oversized.

parameters:
- name: jobName
  type: string
  default: '$(System.JobDisplayName)'
- name: logDirectory
  type: string
  default: 'target'
- name: maxLogLines
  type: number
  default: 80
- name: maxErrorLines
  type: number
  default: 30

steps:
- bash: |
    set -x
    
    # Only run for PR builds
    if [ -z "$SYSTEM_PULLREQUEST_PULLREQUESTNUMBER" ]; then
      echo "Not a PR build, skipping GitHub comment"
      exit 0
    fi
    
    # Check if GitHub token is available
    if [ -z "$GITHUB_TOKEN" ]; then
      echo "##vso[task.logissue type=warning]GITHUB_TOKEN not set, skipping PR comment"
      exit 0
    fi
    
    PR_NUMBER="$SYSTEM_PULLREQUEST_PULLREQUESTNUMBER"
    REPO_NAME="$BUILD_REPOSITORY_NAME"
    JOB_NAME="${{ parameters.jobName }}"
    BUILD_ID="$BUILD_BUILDID"
    BUILD_URL="$SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$SYSTEM_TEAMPROJECT/_build/results?buildId=$BUILD_BUILDID"
    MAX_LINES=${{ parameters.maxLogLines }}
    MAX_ERROR_LINES=${{ parameters.maxErrorLines }}
    LOG_DIR="${{ parameters.logDirectory }}"
    
    echo "Posting failure logs to PR #$PR_NUMBER in $REPO_NAME"
    echo "Job: $JOB_NAME"
    echo "Build URL: $BUILD_URL"
    
    # Create temporary file for the comment body
    COMMENT_FILE=$(mktemp)
    
    # Start building the comment - compact header
    {
      echo "## :x: Build Failed: \`$JOB_NAME\`"
      echo ""
      echo "**Build:** [#$BUILD_ID]($BUILD_URL) | **Commit:** \`${BUILD_SOURCEVERSION:0:7}\`"
      echo ""
    } > "$COMMENT_FILE"
    
    extract_errors() {
      local file="$1"
      local max_lines="$2"
      grep -n -i -E "(error[^s_]|ERROR|FAILED|fatal:|FATAL|exception|cannot |CANNOT |not found|exit 1|exit code|returned non-zero|rc=[1-9]|AssertionError|assert .* ==|FAILURES|short test summary)" "$file" 2>/dev/null | head -n "$max_lines" || true
    }
    
    extract_pytest_summary() {
      local file="$1"
      local summary=""
      summary=$(sed -n '/=.*short test summary/,/=====/{p}' "$file" 2>/dev/null | head -40)
      if [ -z "$summary" ]; then
        summary=$(grep -A 5 -E "^(FAILED|ERROR|=+ .* (failed|passed|error))" "$file" 2>/dev/null | tail -20)
      fi
      echo "$summary"
    }
    
    LOG_COUNT=0
    TOTAL_ERRORS=0
    
    if [ -d "$LOG_DIR" ]; then
      LOG_FILES=$(find "$LOG_DIR" -maxdepth 1 -name "*.log" -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -10 | cut -d' ' -f2-)
      
      if [ -n "$LOG_FILES" ]; then
        for log_file in $LOG_FILES; do
          LOG_COUNT=$((LOG_COUNT + 1))
          log_name=$(basename "$log_file")
          log_lines=$(wc -l < "$log_file" 2>/dev/null || echo "0")
          log_bytes=$(wc -c < "$log_file" 2>/dev/null || echo "0")
          
          ERRORS=$(extract_errors "$log_file" "$MAX_ERROR_LINES")
          ERROR_COUNT=0
          if [ -n "$ERRORS" ]; then
            ERROR_COUNT=$(echo "$ERRORS" | grep -c . 2>/dev/null || echo "0")
          fi
          TOTAL_ERRORS=$((TOTAL_ERRORS + ERROR_COUNT))
          
          PYTEST_SUMMARY=""
          if echo "$log_name" | grep -qi "kvmtest\|pytest\|test.*run"; then
            PYTEST_SUMMARY=$(extract_pytest_summary "$log_file")
          fi
          
          {
            echo "<details>"
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "<summary>:warning: <b>$log_name</b> ($ERROR_COUNT errors, $log_lines lines, ${log_bytes}B)</summary>"
            else
              echo "<summary>:page_facing_up: <b>$log_name</b> ($log_lines lines, ${log_bytes}B)</summary>"
            fi
            echo ""
          } >> "$COMMENT_FILE"
          
          if [ -n "$PYTEST_SUMMARY" ]; then
            {
              echo "**Pytest summary:**"
              echo '```'
              echo "$PYTEST_SUMMARY"
              echo '```'
              echo ""
            } >> "$COMMENT_FILE"
          fi
          
          if [ "$ERROR_COUNT" -gt 0 ]; then
            {
              echo "**Error lines:**"
              echo '```'
              echo "$ERRORS"
              echo '```'
              echo ""
            } >> "$COMMENT_FILE"
          fi
          
          {
            echo "**Tail ($MAX_LINES lines):**"
            echo '```'
            tail -n "$MAX_LINES" "$log_file" 2>/dev/null || echo "(failed to read file)"
            echo '```'
            echo "</details>"
            echo ""
          } >> "$COMMENT_FILE"
        done
      fi
    fi
    
    for extra_log in "/tmp/build-output.log" "/tmp/build.log"; do
      if [ -f "$extra_log" ] 2>/dev/null; then
        LOG_COUNT=$((LOG_COUNT + 1))
        log_name=$(basename "$extra_log")
        log_lines=$(wc -l < "$extra_log" 2>/dev/null || echo "0")
        ERRORS=$(extract_errors "$extra_log" "$MAX_ERROR_LINES")
        ERROR_COUNT=0
        if [ -n "$ERRORS" ]; then
          ERROR_COUNT=$(echo "$ERRORS" | grep -c . 2>/dev/null || echo "0")
        fi
        TOTAL_ERRORS=$((TOTAL_ERRORS + ERROR_COUNT))
        {
          echo "<details>"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "<summary>:warning: <b>$log_name</b> ($ERROR_COUNT errors, $log_lines lines)</summary>"
          else
            echo "<summary>:page_facing_up: <b>$log_name</b> ($log_lines lines)</summary>"
          fi
          echo ""
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "**Error lines:**"
            echo '```'
            echo "$ERRORS"
            echo '```'
            echo ""
          fi
          echo "**Tail ($MAX_LINES lines):**"
          echo '```'
          tail -n "$MAX_LINES" "$extra_log" 2>/dev/null || true
          echo '```'
          echo "</details>"
          echo ""
        } >> "$COMMENT_FILE"
      fi
    done
    
    {
      echo "<details>"
      echo "<summary>:gear: <b>Environment snapshot</b></summary>"
      echo ""
      echo '```'
      echo "=== Docker containers ==="
      docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null | head -20 || echo "(docker ps failed)"
      echo ""
      echo "=== Log directory ==="
      ls -la "$LOG_DIR"/ 2>/dev/null || echo "(not found: $LOG_DIR)"
      echo ""
      echo "=== Disk usage ==="
      df -h / /data 2>/dev/null || true
      echo '```'
      echo "</details>"
      echo ""
    } >> "$COMMENT_FILE"
    
    if [ "$LOG_COUNT" -eq 0 ]; then
      {
        echo ":information_source: **No \`.log\` files found in \`$LOG_DIR\`.** Check [build logs]($BUILD_URL) directly."
        echo ""
      } >> "$COMMENT_FILE"
    fi
    
    {
      echo "---"
      if [ "$TOTAL_ERRORS" -gt 0 ]; then
        echo ":mag: **$TOTAL_ERRORS error(s)** across **$LOG_COUNT log file(s)**"
      else
        echo ":mag: **$LOG_COUNT log file(s)** processed, **0 error patterns matched** — check log tails above"
      fi
    } >> "$COMMENT_FILE"
    
    COMMENT_SIZE=$(wc -c < "$COMMENT_FILE")
    echo "Comment size: $COMMENT_SIZE bytes"
    if [ "$COMMENT_SIZE" -gt 55000 ]; then
      echo "Comment too large ($COMMENT_SIZE bytes), rebuilding with reduced output..."
      REDUCED_FILE=$(mktemp)
      {
        echo "## :x: Build Failed: \`$JOB_NAME\`"
        echo ""
        echo "**Build:** [#$BUILD_ID]($BUILD_URL) | **Commit:** \`${BUILD_SOURCEVERSION:0:7}\`"
        echo ""
        echo ":scissors: *Full comment was ${COMMENT_SIZE} bytes (limit ~55KB). Showing condensed version.*"
        echo ""
      } > "$REDUCED_FILE"
      
      if [ -d "$LOG_DIR" ]; then
        for log_file in $(find "$LOG_DIR" -maxdepth 1 -name "*.log" -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -10 | cut -d' ' -f2-); do
          log_name=$(basename "$log_file")
          log_lines=$(wc -l < "$log_file" 2>/dev/null || echo "0")
          ERRORS=$(extract_errors "$log_file" 15)
          PYTEST_SUMMARY=""
          if echo "$log_name" | grep -qi "kvmtest\|pytest\|test.*run"; then
            PYTEST_SUMMARY=$(extract_pytest_summary "$log_file")
          fi
          {
            echo "<details>"
            echo "<summary><b>$log_name</b> ($log_lines lines)</summary>"
            echo ""
          } >> "$REDUCED_FILE"
          if [ -n "$PYTEST_SUMMARY" ]; then
            {
              echo "**Pytest summary:**"
              echo '```'
              echo "$PYTEST_SUMMARY"
              echo '```'
              echo ""
            } >> "$REDUCED_FILE"
          fi
          if [ -n "$ERRORS" ]; then
            {
              echo "**Error lines:**"
              echo '```'
              echo "$ERRORS"
              echo '```'
              echo ""
            } >> "$REDUCED_FILE"
          fi
          {
            echo "**Tail (30 lines):**"
            echo '```'
            tail -n 30 "$log_file" 2>/dev/null || true
            echo '```'
            echo "</details>"
            echo ""
          } >> "$REDUCED_FILE"
        done
      fi
      
      {
        echo "---"
        echo ":mag: **$TOTAL_ERRORS error(s)** across **$LOG_COUNT log(s)** (condensed)"
      } >> "$REDUCED_FILE"
      
      mv "$REDUCED_FILE" "$COMMENT_FILE"
    fi
    
    # Read the comment content
    COMMENT_BODY=$(cat "$COMMENT_FILE")
    
    # Escape the comment body for JSON
    COMMENT_JSON=$(echo "$COMMENT_BODY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
    
    # Post comment to GitHub PR
    API_URL="https://api.github.com/repos/$REPO_NAME/issues/$PR_NUMBER/comments"
    
    HTTP_CODE=$(curl -s -o /tmp/github_response.json -w "%{http_code}" \
      -X POST \
      -H "Authorization: token $GITHUB_TOKEN" \
      -H "Accept: application/vnd.github.v3+json" \
      -H "Content-Type: application/json" \
      -d "{\"body\": $COMMENT_JSON}" \
      "$API_URL")
    
    if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
      echo "Successfully posted comment to PR #$PR_NUMBER"
      COMMENT_URL=$(cat /tmp/github_response.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url", ""))')
      echo "Comment URL: $COMMENT_URL"
    else
      echo "##vso[task.logissue type=warning]Failed to post comment to GitHub (HTTP $HTTP_CODE)"
      cat /tmp/github_response.json
      echo "##vso[task.complete result=SucceededWithIssues;]GitHub API call failed but build logs were archived"
    fi
    
    # Cleanup
    rm -f "$COMMENT_FILE" /tmp/github_response.json
    
  displayName: 'Post failure logs to GitHub PR'
  condition: failed()
  env:
    GITHUB_TOKEN: $(GITHUB_TOKEN)
    SYSTEM_PULLREQUEST_PULLREQUESTNUMBER: $(System.PullRequest.PullRequestNumber)
    BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
    BUILD_BUILDID: $(Build.BuildId)
    BUILD_SOURCEVERSION: $(Build.SourceVersion)
    SYSTEM_TEAMFOUNDATIONCOLLECTIONURI: $(System.TeamFoundationCollectionUri)
    SYSTEM_TEAMPROJECT: $(System.TeamProject)
