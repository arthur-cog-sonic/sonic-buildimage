# Template to post build failure logs to GitHub PR comments
# Posts ALL log file contents so Devin and reviewers can see the full picture.
# Includes environment snapshot even when no logs exist.

parameters:
- name: jobName
  type: string
  default: '$(System.JobDisplayName)'
- name: logDirectory
  type: string
  default: 'target'
- name: maxLogLines
  type: number
  default: 300
- name: maxErrorLines
  type: number
  default: 50

steps:
- bash: |
    set -x
    
    # Only run for PR builds
    if [ -z "$SYSTEM_PULLREQUEST_PULLREQUESTNUMBER" ]; then
      echo "Not a PR build, skipping GitHub comment"
      exit 0
    fi
    
    # Check if GitHub token is available
    if [ -z "$GITHUB_TOKEN" ]; then
      echo "##vso[task.logissue type=warning]GITHUB_TOKEN not set, skipping PR comment"
      exit 0
    fi
    
    PR_NUMBER="$SYSTEM_PULLREQUEST_PULLREQUESTNUMBER"
    REPO_NAME="$BUILD_REPOSITORY_NAME"
    JOB_NAME="${{ parameters.jobName }}"
    BUILD_ID="$BUILD_BUILDID"
    BUILD_URL="$SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$SYSTEM_TEAMPROJECT/_build/results?buildId=$BUILD_BUILDID"
    MAX_LINES=${{ parameters.maxLogLines }}
    MAX_ERROR_LINES=${{ parameters.maxErrorLines }}
    LOG_DIR="${{ parameters.logDirectory }}"
    
    echo "Posting failure logs to PR #$PR_NUMBER in $REPO_NAME"
    echo "Job: $JOB_NAME"
    echo "Build URL: $BUILD_URL"
    
    # Create temporary file for the comment body
    COMMENT_FILE=$(mktemp)
    
    # Start building the comment - compact header
    {
      echo "## :x: Build Failed: \`$JOB_NAME\`"
      echo ""
      echo "**Build:** [#$BUILD_ID]($BUILD_URL) | **Commit:** \`${BUILD_SOURCEVERSION:0:7}\`"
      echo ""
    } > "$COMMENT_FILE"
    
    extract_errors() {
      local file="$1"
      local max_lines="$2"
      grep -n -i -E "(error[^s]|ERROR|FAILED|fatal:|FATAL|exception|cannot |CANNOT |not found|exit 1|returned non-zero|rc=[1-9])" "$file" 2>/dev/null | head -n "$max_lines" || true
    }
    
    # Find and process log files
    LOG_COUNT=0
    TOTAL_ERRORS=0
    
    if [ -d "$LOG_DIR" ]; then
      LOG_FILES=$(find "$LOG_DIR" -name "*.log" -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -15 | cut -d' ' -f2-)
      
      if [ -n "$LOG_FILES" ]; then
        for log_file in $LOG_FILES; do
          LOG_COUNT=$((LOG_COUNT + 1))
          log_name=$(basename "$log_file")
          log_size=$(wc -l < "$log_file" 2>/dev/null || echo "0")
          
          # Extract errors first
          ERRORS=$(extract_errors "$log_file" "$MAX_ERROR_LINES")
          ERROR_COUNT=$(echo "$ERRORS" | grep -c . 2>/dev/null || echo "0")
          TOTAL_ERRORS=$((TOTAL_ERRORS + ERROR_COUNT))
          
          echo "<details>" >> "$COMMENT_FILE"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "<summary>:warning: <b>$log_name</b> ($ERROR_COUNT errors, $log_size lines total)</summary>" >> "$COMMENT_FILE"
          else
            echo "<summary>:page_facing_up: <b>$log_name</b> ($log_size lines, no error patterns matched)</summary>" >> "$COMMENT_FILE"
          fi
          echo "" >> "$COMMENT_FILE"
          
          # Show errors section if any
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "**Errors found:**" >> "$COMMENT_FILE"
            echo '```' >> "$COMMENT_FILE"
            echo "$ERRORS" >> "$COMMENT_FILE"
            echo '```' >> "$COMMENT_FILE"
            echo "" >> "$COMMENT_FILE"
          fi
          
          # Show tail of log
          echo "**Last $MAX_LINES lines:**" >> "$COMMENT_FILE"
          echo '```' >> "$COMMENT_FILE"
          if [ "$log_size" -gt "$MAX_LINES" ]; then
            tail -n "$MAX_LINES" "$log_file" >> "$COMMENT_FILE"
          else
            cat "$log_file" >> "$COMMENT_FILE"
          fi
          echo '```' >> "$COMMENT_FILE"
          echo "</details>" >> "$COMMENT_FILE"
          echo "" >> "$COMMENT_FILE"
        done
      fi
    fi
    
    # Also check fallback log locations
    for extra_log in "/tmp/build-output.log" "/tmp/build.log"; do
      if [ -f "$extra_log" ] 2>/dev/null; then
        LOG_COUNT=$((LOG_COUNT + 1))
        log_name=$(basename "$extra_log")
        log_size=$(wc -l < "$extra_log" 2>/dev/null || echo "0")
        ERRORS=$(extract_errors "$extra_log" "$MAX_ERROR_LINES")
        ERROR_COUNT=$(echo "$ERRORS" | grep -c . 2>/dev/null || echo "0")
        TOTAL_ERRORS=$((TOTAL_ERRORS + ERROR_COUNT))
        echo "<details>" >> "$COMMENT_FILE"
        if [ "$ERROR_COUNT" -gt 0 ]; then
          echo "<summary>:warning: <b>$log_name</b> ($ERROR_COUNT errors, $log_size lines)</summary>" >> "$COMMENT_FILE"
        else
          echo "<summary>:page_facing_up: <b>$log_name</b> ($log_size lines)</summary>" >> "$COMMENT_FILE"
        fi
        echo "" >> "$COMMENT_FILE"
        if [ "$ERROR_COUNT" -gt 0 ]; then
          echo "**Errors found:**" >> "$COMMENT_FILE"
          echo '```' >> "$COMMENT_FILE"
          echo "$ERRORS" >> "$COMMENT_FILE"
          echo '```' >> "$COMMENT_FILE"
          echo "" >> "$COMMENT_FILE"
        fi
        echo '```' >> "$COMMENT_FILE"
        if [ "$log_size" -gt "$MAX_LINES" ]; then
          tail -n "$MAX_LINES" "$extra_log" >> "$COMMENT_FILE"
        else
          cat "$extra_log" >> "$COMMENT_FILE"
        fi
        echo '```' >> "$COMMENT_FILE"
        echo "</details>" >> "$COMMENT_FILE"
        echo "" >> "$COMMENT_FILE"
      fi
    done
    
    # Always include environment snapshot for debugging
    {
      echo "<details>"
      echo "<summary>:gear: <b>Environment snapshot at failure time</b></summary>"
      echo ""
      echo '```'
      echo "=== Docker containers ==="
      docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null | head -30 || echo "(docker ps failed)"
      echo ""
      echo "=== Log directory listing ==="
      ls -la "$LOG_DIR"/ 2>/dev/null || echo "(log directory not found: $LOG_DIR)"
      echo ""
      echo "=== Disk usage ==="
      df -h / /data 2>/dev/null || true
      echo ""
      echo "=== Recent dmesg (last 10 lines) ==="
      dmesg 2>/dev/null | tail -10 || echo "(dmesg not available)"
      echo '```'
      echo "</details>"
      echo ""
    } >> "$COMMENT_FILE"
    
    if [ "$LOG_COUNT" -eq 0 ]; then
      {
        echo ":information_source: **No \`.log\` files found in \`$LOG_DIR\`.** The job may have failed before any step produced logs."
        echo ""
        echo "Check the [Azure DevOps build logs]($BUILD_URL) directly for details."
        echo ""
      } >> "$COMMENT_FILE"
    fi
    
    # Summary
    {
      echo "---"
      if [ "$TOTAL_ERRORS" -gt 0 ]; then
        echo ":mag: **$TOTAL_ERRORS error(s)** found across **$LOG_COUNT log file(s)**"
      else
        echo ":mag: **$LOG_COUNT log file(s)** processed, **0 error patterns matched** — check full log tails above for the actual failure"
      fi
    } >> "$COMMENT_FILE"
    
    # Truncate comment if it exceeds GitHub's limit (65535 chars)
    COMMENT_SIZE=$(wc -c < "$COMMENT_FILE")
    if [ "$COMMENT_SIZE" -gt 60000 ]; then
      head -c 60000 "$COMMENT_FILE" > "${COMMENT_FILE}.tmp"
      echo "" >> "${COMMENT_FILE}.tmp"
      echo ":scissors: *Comment truncated (${COMMENT_SIZE} chars). See [build logs]($BUILD_URL) for full output.*" >> "${COMMENT_FILE}.tmp"
      mv "${COMMENT_FILE}.tmp" "$COMMENT_FILE"
    fi
    
    # Read the comment content
    COMMENT_BODY=$(cat "$COMMENT_FILE")
    
    # Escape the comment body for JSON
    COMMENT_JSON=$(echo "$COMMENT_BODY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
    
    # Post comment to GitHub PR
    API_URL="https://api.github.com/repos/$REPO_NAME/issues/$PR_NUMBER/comments"
    
    HTTP_CODE=$(curl -s -o /tmp/github_response.json -w "%{http_code}" \
      -X POST \
      -H "Authorization: token $GITHUB_TOKEN" \
      -H "Accept: application/vnd.github.v3+json" \
      -H "Content-Type: application/json" \
      -d "{\"body\": $COMMENT_JSON}" \
      "$API_URL")
    
    if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
      echo "Successfully posted comment to PR #$PR_NUMBER"
      COMMENT_URL=$(cat /tmp/github_response.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url", ""))')
      echo "Comment URL: $COMMENT_URL"
    else
      echo "##vso[task.logissue type=warning]Failed to post comment to GitHub (HTTP $HTTP_CODE)"
      cat /tmp/github_response.json
      echo "##vso[task.complete result=SucceededWithIssues;]GitHub API call failed but build logs were archived"
    fi
    
    # Cleanup
    rm -f "$COMMENT_FILE" /tmp/github_response.json
    
  displayName: 'Post failure logs to GitHub PR'
  condition: failed()
  env:
    GITHUB_TOKEN: $(GITHUB_TOKEN)
    SYSTEM_PULLREQUEST_PULLREQUESTNUMBER: $(System.PullRequest.PullRequestNumber)
    BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
    BUILD_BUILDID: $(Build.BuildId)
    BUILD_SOURCEVERSION: $(Build.SourceVersion)
    SYSTEM_TEAMFOUNDATIONCOLLECTIONURI: $(System.TeamFoundationCollectionUri)
    SYSTEM_TEAMPROJECT: $(System.TeamProject)
